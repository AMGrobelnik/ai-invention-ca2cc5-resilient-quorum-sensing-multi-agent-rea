[project]
name = "gen_art_experiment_1"
version = "0.1.0"
description = "Stabilized Quorum-Sensing Multi-Agent Reasoning Experiment"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "requests==2.34.2",
    "pydantic==2.13.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
