[project]
name = "gen_art_evaluation_1"
version = "0.1.0"
description = "Online Temperature Adaptation Sensitivity Analysis Evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
    "requests==2.34.2"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
